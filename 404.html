<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Страница не найдена — UBE</title>
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
  <link rel="stylesheet" href="./assets/fonts/fonts.css" />
  <style>
    :root { --bg: #09090D; --copper: #C8883A; --text: #F0EAE0; --muted: #7A7690; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      background-image: linear-gradient(rgba(200,136,58,0.09) 1px, transparent 1px), linear-gradient(90deg, rgba(200,136,58,0.09) 1px, transparent 1px);
      background-size: 56px 56px;
      color: var(--text); font-family: 'Figtree', sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px;
    }
    .wrap { max-width: 480px; }
    .code { font-family: 'Barlow Condensed', sans-serif; font-size: clamp(80px, 20vw, 140px); color: var(--copper); line-height: 1; letter-spacing: 4px; opacity: 0.15; }
    h1 { font-family: 'Barlow Condensed', sans-serif; font-size: clamp(28px, 6vw, 42px); letter-spacing: 2px; margin-top: -20px; }
    p { color: var(--muted); margin-top: 12px; font-size: 16px; line-height: 1.6; }
    a { display: inline-flex; align-items: center; gap: 8px; margin-top: 32px; background: var(--copper); color: #09090D; font-weight: 700; font-family: 'Figtree', sans-serif; padding: 14px 28px; border-radius: 12px; text-decoration: none; font-size: 15px; transition: opacity 0.2s; }
    a:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>СТРАНИЦА НЕ НАЙДЕНА</h1>
    <p>Возможно, страница была перемещена или удалена.<br>Вернитесь на главную.</p>
    <a href="./index.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      На главную
    </a>
  </div>
</body>
</html>
